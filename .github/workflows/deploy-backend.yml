name: 🚀 Deploy Backend Services to Lightsail

on:
  push:
    branches: [Main]
    paths:
      - 'backend-database/**'
      - 'backend-database/backend/services/backend_robodialer/frontend/**'
      - 'docker-compose.production.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Build and Push Backend Database Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-database/backend
          file: ./backend-database/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend-database:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend-database:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Build and Push Robo-Dialer Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-database/backend/services/backend_robodialer/frontend
          file: ./backend-database/backend/services/backend_robodialer/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-robo-dialer-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-robo-dialer-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🚀 Deploy to Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || '22' }}
          script: |
            # Set environment variables
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export GITHUB_SHA="${{ github.sha }}"
            export REGISTRY="${{ env.REGISTRY }}"

            # Create app directory if it doesn't exist
            mkdir -p /home/ubuntu/leadgen-app
            cd /home/ubuntu/leadgen-app

            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # Pull latest images
            echo "🔄 Pulling latest images..."
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}-backend-database:latest || true
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}-robo-dialer-frontend:latest || true

            # Stop existing containers
            echo "🛑 Stopping existing containers..."
            docker-compose -f docker-compose.production.yml down || true

            # Create production docker-compose file
            echo "📋 Creating production docker-compose file..."
            cat > docker-compose.production.yml << 'EOF'
            version: '3.8'

            services:
              backend-database:
                image: ghcr.io/${GITHUB_REPOSITORY}-backend-database:latest
                container_name: backend-database-prod
                ports:
                  - "8001:8001"
                env_file:
                  - .env.production
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                networks:
                  - app-network

              robo-dialer-frontend:
                image: ghcr.io/${GITHUB_REPOSITORY}-robo-dialer-frontend:latest
                container_name: robo-dialer-frontend-prod
                ports:
                  - "9002:3000"
                environment:
                  - NODE_ENV=production
                  - NEXT_PUBLIC_API_URL=http://localhost:8001
                restart: unless-stopped
                depends_on:
                  - backend-database
                networks:
                  - app-network

              watchtower:
                image: containrrr/watchtower
                container_name: watchtower-prod
                volumes:
                  - /var/run/docker.sock:/var/run/docker.sock
                environment:
                  - WATCHTOWER_CLEANUP=true
                  - WATCHTOWER_POLL_INTERVAL=300
                command: --interval 300 --cleanup
                restart: unless-stopped

            networks:
              app-network:
                driver: bridge
            EOF

            # Start services
            echo "🚀 Starting services..."
            docker-compose -f docker-compose.production.yml up -d

            # Wait for services to be healthy
            echo "⏳ Waiting for services to be healthy..."
            sleep 30

            # Check service status
            echo "📊 Service status:"
            docker-compose -f docker-compose.production.yml ps

            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "✅ Deployment completed successfully!"

      - name: 🔍 Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_IP }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_SSH_PORT || '22' }}
          script: |
            cd /home/ubuntu/leadgen-app
            echo "🔍 Checking service health..."
            docker-compose -f docker-compose.production.yml ps
            echo "🌐 Testing endpoints..."
            curl -f http://localhost:8001/health || echo "Backend health check failed"
            curl -f http://localhost:9002 || echo "Frontend health check failed"
            echo "✅ Verification completed!"
