name: CD Pipeline (Deploy to Lightsail)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout Repo
        uses: actions/checkout@v3

      - name: 🔐 Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.LIGHTSAIL_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to Lightsail
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.LIGHTSAIL_HOST }} << 'EOF'
            mkdir -p ~/scraper-webapp
            cd ~/scraper-webapp

            # 🧠 Clone as LeadgenAI (not DataEnhancement)
            if [ ! -d "LeadGenAI" ]; then
              git clone https://${{ secrets.GH_PAT_DEPLOY }}@github.com/Caprae-Capital-Partners/LeadGenAI.git
            fi

            cd LeadGenAI || exit 1
            git remote set-url origin https://${{ secrets.GH_PAT_DEPLOY }}@github.com/Caprae-Capital-Partners/LeadGenAI.git
            git fetch origin main
            git reset --hard origin/main

            # 🔐 Inject env variables
            echo "${{ secrets.BACKEND_ENV_VARS }}" > .env
            echo "${{ secrets.BACKEND_AI_ENV_VARS }}" > backend_ai_news/.env
            echo "${{ secrets.BACKEND_PE_VALIDATOR_ENV_VARS }}" > backend_phoneValidator/.env
            echo "${{ secrets.BACKEND_INSIGHTS_ENV_VARS }}" > backend_company_insights/.env
            echo "${{ secrets.FRONTEND_ENV_VARS }}" > frontend/.env

            # 🧹 Prune unused Docker images/volumes/containers
            docker system prune -af --volumes
            
            # 🚀 Pull latest code & deploy
            docker compose down
            docker compose build
            docker compose up -d
            
            # 🔄 Restart nginx-proxy
            docker restart nginx-proxy
          EOF
