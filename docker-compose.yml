version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend_phase2/Dockerfile
    container_name: leadgen-api
    ports:
      - "5050:5050"
    env_file:
      - .env
    restart: always

  scraper:
    build: 
      context: ./phase_1
      dockerfile: Dockerfile
    container_name: scraper-api
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: always

  flaresolverr:
    image: 21hsmw/flaresolverr:nodriver
    container_name: flaresolverr
    ports:
      - "8191:8191"
    restart: always

  ai-news-api:
    build:
      context: ./backend_ai_news
      dockerfile: Dockerfile
    container_name: ai-news-api
    ports:
      - "5100:5100"
    env_file:
      - .env
    restart: always

  lead-score:
    build:
      context: ./backendLeadscoring
      dockerfile: DockerFile
    container_name: ai-lead-score
    ports:
      - "5001:5001"
    env_file:
      - .env
    restart: always

  phone-email-validator:
    build:
      context: ./backend_phoneValidator
      dockerfile: Dockerfile
    container_name: phone-email-validator
    ports:
      - "5002:5002"
    env_file:
      - .env
    restart: always

  company-insights:
    build:
      context: ./backend_company_insights
      dockerfile: Dockerfile
    container_name: company-insights-api
    ports:
      - "5003:5003"
    env_file:
      - .env
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro  # ✅ mount certs into container
    restart: always

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30
    restart: always
