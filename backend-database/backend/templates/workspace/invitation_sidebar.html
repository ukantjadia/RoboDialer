{% extends "base.html" %}

{% block title %}Invitations{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header" style="background-color: var(--background-color);">
                    <h4><i class="bi bi-envelope"></i> Team Invitations</h4>
                </div>
                <div class="card-body" style="background-color: var(--background-color);">
                    <div id="invitationContent">
                        <div class="text-center text-muted">
                            <i class="bi bi-envelope-open" style="font-size: 3rem; opacity: 0.5;"></i>
                            <p class="mt-3">Loading invitations...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.invitation-item {
    background: var(--background-color);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 1rem;
    margin-bottom: 1rem;
    transition: all 0.2s ease;
}
.card {
    background-color: var(--background-color);
    border: 1px solid var(--border-color);
}

.invitation-item:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.invitation-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.5rem;
}

.invitation-email {
    font-weight: 600;
    color: var(--text-color);
}

.invitation-role {
    background: var(--primary-color);
    color: white;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
}

.invitation-details {
    font-size: 0.875rem;
    color: var(--secondary-color);
    margin-bottom: 1rem;
}

.invitation-actions {
    display: flex;
    gap: 0.5rem;
}

.btn-accept {
    background: var(--success-color, #28a745);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.875rem;
    flex: 1;
}

.btn-decline {
    background: var(--danger-color, #dc3545);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.875rem;
    flex: 1;
}

.btn-accept:hover, .btn-decline:hover {
    opacity: 0.9;
}

.invitation-expired {
    background: var(--warning-color, #ffc107);
    color: var(--text-color);
    padding: 0.5rem;
    border-radius: 4px;
    font-size: 0.875rem;
    margin-bottom: 1rem;
}

.no-invitations {
    text-align: center;
    padding: 2rem;
    color: var(--secondary-color);
}
</style>

<script>
// invitations variable is already declared in base.html

// All invitation functions are already defined in base.html
// This page uses the existing invitation system from base.html
</script>
{% endblock %}
