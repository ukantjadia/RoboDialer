{% extends "base.html" %}

{% block title %}Release Notes{% endblock %}

{% block additional_styles %}
{{ super() }}
<style>
    .release-notes-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1rem;
    }

    .release-notes-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .release-notes-title {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-color);
        margin-bottom: 1rem;
    }

    .release-notes-subtitle {
        color: var(--secondary-color);
        font-size: 1.1rem;
    }

    .timeline {
        position: relative;
        padding: 2rem 0;
    }

    .timeline::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 2px;
        height: 100%;
        background: var(--border-color);
    }

    .timeline-item {
        position: relative;
        margin-bottom: 3rem;
        width: calc(50% - 2rem);
        margin-left: auto;
    }

    .timeline-item:nth-child(even) {
        margin-left: 0;
        margin-right: auto;
    }

    .timeline-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: -3.5rem;
        width: 1rem;
        height: 1rem;
        background: var(--primary-color);
        border-radius: 50%;
        border: 2px solid var(--background-color);
    }

    .timeline-item:nth-child(even)::before {
        left: auto;
        right: -3.5rem;
    }

    .timeline-content {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 1.5rem;
        position: relative;
    }

    .timeline-content::before {
        content: '';
        position: absolute;
        top: 0.75rem;
        left: -0.5rem;
        width: 1rem;
        height: 1rem;
        background: var(--card-bg);
        border-left: 1px solid var(--border-color);
        border-bottom: 1px solid var(--border-color);
        transform: rotate(45deg);
    }

    .timeline-item:nth-child(even) .timeline-content::before {
        left: auto;
        right: -0.5rem;
        border-left: none;
        border-right: 1px solid var(--border-color);
    }

    .timeline-date {
        font-size: 0.875rem;
        color: var(--secondary-color);
        margin-bottom: 0.5rem;
    }

    .timeline-title {
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-color);
        margin-bottom: 1rem;
    }

    .timeline-body {
        color: var(--text-color);
        margin-bottom: 1rem;
    }

    .timeline-type {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.875rem;
        font-weight: 500;
    }

    .type-feature {
        background: rgba(34, 197, 94, 0.1);
        color: #4ade80;
    }

    .type-bug {
        background: rgba(239, 68, 68, 0.1);
        color: #f87171;
    }

    .type-improvement {
        background: rgba(6, 182, 212, 0.1);
        color: #67e8f9;
    }

    .timeline-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 1rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border-color);
    }

    .dismiss-btn {
        background: none;
        border: 1px solid var(--border-color);
        color: var(--secondary-color);
        padding: 0.5rem 1rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.875rem;
        transition: all 0.2s ease;
    }

    .dismiss-btn:hover {
        background: var(--border-color);
        color: var(--text-color);
    }

    .dismiss-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    @media (max-width: 768px) {
        .timeline::before {
            left: 1rem;
        }

        .timeline-item {
            width: calc(100% - 3rem);
            margin-left: 3rem;
        }

        .timeline-item:nth-child(even) {
            margin-left: 3rem;
            margin-right: 0;
        }

        .timeline-item::before {
            left: -2rem;
        }

        .timeline-item:nth-child(even)::before {
            left: -2rem;
            right: auto;
        }

        .timeline-content::before {
            left: -0.5rem;
        }

        .timeline-item:nth-child(even) .timeline-content::before {
            left: -0.5rem;
            right: auto;
            border-left: 1px solid var(--border-color);
            border-right: none;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="release-notes-container">
    <div class="release-notes-header">
        <h1 class="release-notes-title">Release Notes</h1>
        <p class="release-notes-subtitle">Stay up to date with our latest updates and improvements</p>
    </div>

    <div class="timeline" id="timeline">
        <!-- Release notes will be inserted here -->
    </div>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const timeline = document.getElementById('timeline');
    
    // Fetch release notes
    async function fetchNotes() {
        try {
            const response = await fetch('/api/release-notes', {
                headers: {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            if (!response.ok) {
                throw new Error('Failed to fetch notes');
            }

            const data = await response.json();
            const notes = data.notes || [];
            renderNotes(notes);
        } catch (error) {
            timeline.innerHTML = '<div class="text-center text-muted">Failed to load release notes</div>';
        }
    }

    // Render notes in timeline
    function renderNotes(notes) {
        if (!notes.length) {
            timeline.innerHTML = '<div class="text-center text-muted">No release notes available</div>';
            return;
        }

        timeline.innerHTML = notes.map(note => `
            <div class="timeline-item" data-note-id="${note.id}">
                <div class="timeline-content">
                    <div class="timeline-date">${formatDate(note.created_at)}</div>
                    <h3 class="timeline-title">${escapeHtml(note.title)}</h3>
                    <div class="timeline-body">${escapeHtml(note.content)}</div>
                    <div class="timeline-actions">
                        <span class="timeline-type type-${note.type}">
                            ${capitalizeFirst(note.type)}
                        </span>
                        <button class="dismiss-btn" onclick="dismissNote(${note.id}, this)" title="Dismiss this note">
                            Dismiss
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Dismiss note function
    window.dismissNote = async function(noteId, button) {
        if (button.disabled) return;
        
        button.disabled = true;
        button.textContent = 'Dismissing...';
        
        try {
            const response = await fetch(`/api/release-notes/${noteId}/dismiss`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });

            if (!response.ok) {
                throw new Error('Failed to dismiss note');
            }

            // Remove the note from the timeline with animation
            const noteElement = document.querySelector(`[data-note-id="${noteId}"]`);
            if (noteElement) {
                noteElement.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                noteElement.style.opacity = '0';
                noteElement.style.transform = 'scale(0.95)';
                
                setTimeout(() => {
                    noteElement.remove();
                    
                    // Check if no notes left
                    const remainingNotes = document.querySelectorAll('.timeline-item');
                    if (remainingNotes.length === 0) {
                        timeline.innerHTML = '<div class="text-center text-muted">No release notes available</div>';
                    }
                }, 300);
            }
        } catch (error) {
            button.disabled = false;
            button.textContent = 'Dismiss';
            alert('Failed to dismiss note. Please try again.');
        }
    };

    // Helper Functions
    function formatDate(dateString) {
        return new Date(dateString).toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });
    }

    function capitalizeFirst(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    function escapeHtml(unsafe) {
        return unsafe
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Initial load
    fetchNotes();
});
</script>
{% endblock %}
