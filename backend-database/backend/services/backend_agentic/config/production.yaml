# Production Environment Configuration

# DeepSeek API
deepseek:
  api_key: ${DEEPSEEK_API_KEY}
  base_url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout: ${DEEPSEEK_TIMEOUT:60}
  max_retries: ${DEEPSEEK_MAX_RETRIES:5}
  enable_mock_fallback: ${ENABLE_MOCK_FALLBACK:false}

# Data Management
data:
  csv_path: ${CSV_DATA_PATH:data/production_companies.csv}
  enable_hot_reload: ${ENABLE_HOT_RELOAD:false}
  validation_enabled: ${DATA_VALIDATION_ENABLED:true}

# Web Scraping
scraper:
  timeout: ${SCRAPER_TIMEOUT:45}
  max_retries: ${SCRAPER_MAX_RETRIES:5}
  user_agent: "AgenticBackend/1.0 (Production)"
  respect_robots_txt: true
  delay_between_requests: 2.0

# Haystack RAG System
haystack:
  document_store: ${HAYSTACK_DOCUMENT_STORE:qdrant}
  embedding_model: ${HAYSTACK_EMBEDDING_MODEL:sentence-transformers/all-MiniLM-L6-v2}
  top_k: ${HAYSTACK_TOP_K:10}
  index_name: ${HAYSTACK_INDEX_NAME:company_knowledge_base}
  
  # Document Store Configurations
  qdrant:
    host: ${QDRANT_HOST:qdrant-server}
    port: ${QDRANT_PORT:6333}
    collection_name: ${QDRANT_COLLECTION_NAME:company_documents}
    vector_size: 384
    distance: "Cosine"
    
  faiss:
    index_path: ${FAISS_INDEX_PATH:/data/faiss_index}
    index_type: "IndexHNSWFlat"
    
  inmemory:
    embedding_dim: 384

# LangGraph Configuration
langgraph:
  recursion_limit: ${LANGGRAPH_RECURSION_LIMIT:100}
  checkpoint_enabled: ${LANGGRAPH_CHECKPOINT_ENABLED:true}
  debug_mode: false

# System Settings
system:
  log_level: ${LOG_LEVEL:WARNING}
  enable_metrics: ${ENABLE_METRICS:true}
  max_concurrent_tools: ${MAX_CONCURRENT_TOOLS:5}
  environment: ${ENVIRONMENT:production}